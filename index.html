<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* theme before the first paint: the visitor's choice, else the system setting */
      (function () {
        var d = document.documentElement;
        try {
          var saved = localStorage.getItem('bilimgo:theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          d.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          d.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="description" content="Каталог учебных центров Самарканда: английский и IELTS, программирование, математика, подготовка к ДТМ и SAT. Адреса, часы работы и телефоны на карте города." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>BilimGo — учебные центры Самарканда</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
